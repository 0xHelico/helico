specVersion: 1.0.0
description: >-
  Aqua on Arbitrum One, indexed so that a maker's strategies can be found at all. Aqua keeps its
  balances in a private mapping four levels deep and indexes no event parameter, so there is no
  on-chain way to ask which strategies a wallet has.
repository: https://github.com/0xHelico/helico
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum/contract
    name: Aqua
    network: arbitrum-one
    source:
      address: "0x1111113CCf1426A8E30e2bfF5E005d929bF6a90a"
      abi: Aqua
      # There is no history to index. Aqua at the canonical address has **zero events across
      # the whole of Arbitrum** — verified by scanning from block 1 forward, with the same query
      # run against the stale address first to prove it can find something (it returned 1,289).
      # A control like that is not ceremony: an empty result from a broken query looks exactly
      # like an empty chain, and that mistake cost us a day.
      #
      # So this starts at the head as of 8 September. Indexing earlier would cost hundreds of
      # millions of blocks to find nothing. It also means the first strategy this subgraph ever
      # sees will most likely be ours.
      startBlock: 502755018
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      file: ./src/aqua.ts
      entities:
        - Maker
        - App
        - Mandate
        - Balance
        - Movement
      abis:
        - name: Aqua
          file: ./abis/Aqua.json
      eventHandlers:
        - event: Shipped(address,address,bytes32,bytes)
          handler: handleShipped
        - event: Docked(address,address,bytes32)
          handler: handleDocked
        - event: Pulled(address,address,bytes32,address,uint256)
          handler: handlePulled
        - event: Pushed(address,address,bytes32,address,uint256)
          handler: handlePushed
