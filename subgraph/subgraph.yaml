specVersion: 1.0.0
description: >-
  Aqua on Arbitrum One, indexed so that a maker's strategies can be found at all. Aqua keeps its
  balances in a private mapping four levels deep and indexes no event parameter, so there is no
  on-chain way to ask which strategies a wallet has.
repository: https://github.com/0xHelico/helico
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum/contract
    name: Aqua
    network: arbitrum-one
    source:
      # The Aqua 1inch actually uses. This was 0x499943E7…, which is a real Aqua, has real
      # events, and has been dead since block 451,737,844 — see #165.
      #
      # Two checks settle which is which, and neither is a matter of opinion:
      #   - `@1inch/aqua-sdk` exports AQUA_CONTRACT_ADDRESSES[42161] = this address
      #   - the deployed AquaSwapVMRouter (0x111111338c…) has this address in its bytecode
      #     and no reference at all to 0x499943E7…
      #
      # They are not the same contract, either: this one answers `owner()` with
      # 0x5AFc5DF416640348235a0571dBEEf9064cb0338D, and 0x499943E7… reverts on it. All six
      # external selectors match, and a ship-then-quote against this one on a fork works where
      # the same sequence against the old one reverted.
      address: "0x1111113ccf1426a8e30e2bff5e005d929bf6a90a"
      abi: Aqua
      # This contract's first log — an `OwnershipTransferred`, so this is its deployment. Its
      # first `Shipped` is 485,793,304; starting at deployment costs 288k blocks of empty
      # scanning and cannot be wrong, which is worth more than the saving.
      #
      # Found with `eth_getLogs`, bisected. Not with `eth_getCode`, and the previous comment
      # here is why — that search, with `2>/dev/null` on the call, read every "state too old"
      # error as "no code yet" and returned the node's pruning boundary instead of a
      # deployment, 28 million blocks late.
      #
      # The address above was found by scanning forward for a contract emitting Aqua's events.
      # That is the same class of mistake one level up: scanning for a contract that behaves
      # like Aqua finds a contract that behaves like Aqua. It cannot tell you whether anyone
      # still uses it. Read the address out of the vendor's own SDK instead.
      startBlock: 485505646
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      file: ./src/aqua.ts
      entities:
        - Maker
        - App
        - Mandate
        - Balance
        - Movement
      abis:
        - name: Aqua
          file: ./abis/Aqua.json
      eventHandlers:
        - event: Shipped(address,address,bytes32,bytes)
          handler: handleShipped
        - event: Docked(address,address,bytes32)
          handler: handleDocked
        - event: Pulled(address,address,bytes32,address,uint256)
          handler: handlePulled
        - event: Pushed(address,address,bytes32,address,uint256)
          handler: handlePushed

  - kind: ethereum/contract
    name: HelicoAccountFactory
    network: arbitrum-one
    source:
      # Ours, deployed 8 September 2026 — see docs/deployments.md for the transaction.
      address: "0x01cc7d9fe8da79b61bcc5d3f7e3f0433dce7e081"
      abi: HelicoAccountFactory
      # The factory's own deployment block. There is nothing before it, so this is exact rather
      # than a safe underestimate, and it saves 17 million blocks of scanning against the Aqua
      # start above.
      startBlock: 502979401
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      file: ./src/factory.ts
      entities:
        - Account
      abis:
        - name: HelicoAccountFactory
          file: ./abis/HelicoAccountFactory.json
      eventHandlers:
        - event: AccountOpened(indexed address,address)
          handler: handleAccountOpened
