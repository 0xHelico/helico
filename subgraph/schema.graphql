# The question Aqua cannot answer about itself.
#
# `_balances` is `private` and four levels deep — maker, app, strategyHash, token — so nothing
# can enumerate it, and `rawBalances` needs a hash you already have. None of the four events
# index a single parameter, so logs cannot be filtered by maker either. Between them, that means
# "which mandates does this wallet have, and what is left in each?" has no on-chain answer at
# all. Everything below exists to answer exactly that.

"A wallet that has shipped at least one strategy. Its tokens never move into Aqua."
type Maker @entity(immutable: false) {
  "The maker's address."
  id: Bytes!
  mandates: [Mandate!]! @derivedFrom(field: "maker")
  "Shipped strategies, including docked ones."
  mandateCount: Int!
  "Strategies not yet docked."
  activeMandateCount: Int!
  "Fills executed against this maker through the router. See `Fill` for why it is not per-mandate."
  fills: [Fill!]! @derivedFrom(field: "maker")
  "How many, so the count is one read rather than a page of them."
  fillCount: Int!
}

"An app a maker has given spending rights to. Aqua namespaces every balance by this."
type App @entity(immutable: false) {
  "The app's contract address."
  id: Bytes!
  mandates: [Mandate!]! @derivedFrom(field: "app")
  mandateCount: Int!
  activeMandateCount: Int!
}

"""
One strategy, as Aqua files it: the hash of whatever bytes the maker shipped.

`strategy` is kept raw and undecoded on purpose. Aqua never interprets those bytes, and neither
should an indexer — each app defines its own struct, so decoding here would bake one app's
layout into a subgraph meant to serve all of them. A consumer decodes it with the ABI it owns.
"""
type Mandate @entity(immutable: false) {
  "maker ‖ app ‖ strategyHash, hashed. Not the strategy hash alone: Aqua keys balances by all three."
  id: Bytes!
  maker: Maker!
  app: App!
  "Aqua's own identifier: keccak256 of the shipped bytes."
  strategyHash: Bytes!
  "The bytes the maker shipped, verbatim."
  strategy: Bytes!
  """
  True while at least one token under this mandate is still spendable.

  Derived from the ledger rather than from the `Docked` event, because the event is not proof
  of anything: `dock` with an empty token array emits it and revokes nothing, and a mandate
  shipped with disjoint token sets can be docked one subset at a time. Aqua's unit of
  revocation is (maker, app, hash, token) — see `Balance.tokensCount` for the per-token truth.
  """
  active: Boolean!
  balances: [Balance!]! @derivedFrom(field: "mandate")
  movements: [Movement!]! @derivedFrom(field: "mandate")
  shippedAt: BigInt!
  shippedAtBlock: BigInt!
  shippedTx: Bytes!
  dockedAt: BigInt
  "Pulls plus pushes. A swap is normally one of each."
  movementCount: Int!
}

"What is left of one token under one mandate. This is the number an agent has to know before acting."
type Balance @entity(immutable: false) {
  "mandate id ‖ token."
  id: Bytes!
  mandate: Mandate!
  token: Bytes!
  "Current spendable amount, as Aqua's ledger holds it."
  amount: BigInt!
  """
  Aqua's own three-state sentinel, and the only honest answer to "can this token still be
  spent?": 0 never shipped, 1–254 active and equal to the token count of the ship that created
  it, 255 docked.

  Without this the schema models Aqua's key correctly and its state machine incorrectly — a
  balance would still read as spendable after the maker revoked it, because `dock` zeroes the
  ledger on chain and emits no per-token event to say so.
  """
  tokensCount: Int!
  "Everything ever pulled out, cumulative."
  totalPulled: BigInt!
  "Everything ever pushed in, cumulative — including the initial ship."
  totalPushed: BigInt!
}

enum Direction {
  "Out of the maker's wallet, straight to a recipient."
  PULL
  "Into the maker's wallet, straight from a payer."
  PUSH
}

"One movement of one token. Immutable: it records something that happened."
type Movement @entity(immutable: true) {
  id: Bytes!
  mandate: Mandate!
  token: Bytes!
  amount: BigInt!
  direction: Direction!
  timestamp: BigInt!
  block: BigInt!
  tx: Bytes!
}

"""
An account opened by `HelicoAccountFactory`, and the reason this subgraph indexes a contract of
ours alongside 1inch's.

The enclave manages accounts, and until this existed it managed exactly one — the address written
into `config.production.json` by hand. Nothing enumerated the others, so an account a stranger
opened sat there with no agent looking at it while the panel that showed it implied otherwise.

`AccountOpened` indexes the owner, so this is recoverable from logs alone; it is here rather than
in an `eth_getLogs` loop because the workflow already queries this endpoint for mandate demand,
and one round trip that returns both is cheaper inside an enclave than two.
"""
type Account @entity(immutable: true) {
  "The account's address. Deterministic from the owner — `keccak256(abi.encode(owner))` as the CREATE2 salt."
  id: Bytes!
  "The wallet the account belongs to, fixed in the proxy's bytecode and never changeable."
  owner: Bytes!
  openedAt: BigInt!
  openedAtBlock: BigInt!
  openedTx: Bytes!
}

"""
One fill through 1inch's SwapVM router, which is the fifth of the five events 1inch's own Aqua
documentation asks an indexer to cover — and the one this subgraph did not have.

> A hosted subgraph is not currently available. Build a reference indexer over the five
> registry/router events keyed on `(maker, app, strategyHash)`.
> — 1inch Business, Aqua → Data & Analytics

**`orderHash` is the `strategyHash`.** For an order that settles through Aqua, SwapVM hashes
`keccak256(abi.encode(order))` and the maker shipped exactly those bytes, so Aqua's hash of them is
the same number — measured 12 September: 60 of 60 distinct `orderHash` values on Arbitrum One match
a shipped mandate. An earlier version of this text said they differed. There is still no `mandate`
edge on `Fill`, because adding one is a schema change and the deployed version is kept as it is
until after the hackathon; join on `fills.orderHash == mandates.strategyHash` meanwhile. The
`maker` edge is real — the event carries the address.

Immutable: it records something that happened.
"""
type Fill @entity(immutable: true) {
  "tx hash ‖ log index."
  id: Bytes!
  "The maker whose tokens moved. The one link the event actually supports."
  maker: Maker!
  "Whoever called the router. A contract by construction — the fill arrives as a callback."
  taker: Bytes!
  "The router's own identifier for the order it executed. Not a strategy hash."
  orderHash: Bytes!
  "What the taker gave."
  tokenIn: Bytes!
  "What the maker gave."
  tokenOut: Bytes!
  amountIn: BigInt!
  amountOut: BigInt!
  timestamp: BigInt!
  block: BigInt!
  tx: Bytes!
}
