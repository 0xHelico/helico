# The headers every response from this site carries.
#
# In a file of its own because nginx's `add_header` does **not** merge: a `location` that sets any
# header of its own discards every header inherited from the server block. Both locations here set
# `Cache-Control`, so both were quietly dropping most of the list the server block declared.
#
# That was measured against production rather than inferred. A stylesheet came back with two of
# the five — `Cache-Control` and `X-Content-Type-Options`, no `X-Frame-Options`, no CSP, no
# `Referrer-Policy` — and the HTML with four, missing `Permissions-Policy`, which the `location /`
# block simply did not repeat.
#
# `include` this from the server block and from every location that adds a header of its own.
# `scripts/check-nginx-headers.py` fails if one forgets, which is the only way this stays true:
# the loss is silent, and nothing about a response says which headers it should have had.
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options DENY always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
# Google Analytics gets exactly three things — its script, its beacons and its pixel — and
# everything else that is not this site is refused.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: https://www.googletagmanager.com https://*.google-analytics.com; connect-src 'self' https://*.google-analytics.com https://*.analytics.google.com https://*.googletagmanager.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
