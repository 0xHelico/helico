# Serves the built site. TLS, HSTS and the public hostname are the host proxy's job.
#
# The security headers live in security-headers.conf and are included in three places, which is
# not duplication for its own sake: nginx discards every inherited `add_header` in a location that
# sets one of its own, so a location that wants a Cache-Control has to restate the rest or lose it.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    absolute_redirect off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/xml application/xml text/plain;

    include /etc/nginx/security-headers.conf;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Astro's hashed assets never change under the same name.
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/security-headers.conf;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        include /etc/nginx/security-headers.conf;
        try_files $uri $uri/index.html $uri/ =404;
    }
}
