# ==========================================================================
# CRE SECRETS — the model router
# ==========================================================================
# The second half of `secrets.yaml`, split only because `cre secrets create`
# refuses more than ten items in one payload. Upload both files; the DON holds
# one namespace and the workflow asks for names, not for files.
#
# Two auth layers that cannot share one header: nginx wants Basic, the
# application wants its own. Both are released only into the enclave, which is
# what makes the model call a private input of the Confidential Workflow
# rather than an outbound request anyone can watch.
secretsNames:
    AI_USERNAME:
        - SECRET_AI_USERNAME
    AI_PASSWORD:
        - SECRET_AI_PASSWORD
    AI_API_KEY:
        - SECRET_AI_API_KEY
