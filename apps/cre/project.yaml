# ==========================================================================
# CRE PROJECT SETTINGS
# ==========================================================================
# Helico's workflow reads the chain from inside the enclave and writes its
# verdict back, so unlike the template it genuinely needs an RPC.
#
# `staging-settings` points at a LOCAL FORK of Arbitrum One. That is the target
# you can run today. `rehearse-idle.sh` starts the fork, deploys the account
# factory onto it, opens an account, funds it with real USDC and WETH, permits
# the four markets the production config names, and lets the enclave choose
# between them.
#
# The chain name is Arbitrum One either way. A fork keeps chain id 42161, which
# is also what the deploy script insists on.
staging-settings:
    rpcs:
        - chain-name: ethereum-mainnet-arbitrum-1
          url: http://127.0.0.1:8546
# ==========================================================================
# `production-settings` is the same workflow against the real chain. It needs an
# account opened on Arbitrum One, and opening one is not something this file can
# do for you.
production-settings:
    account:
        # Who owns the deployed workflow: may update it, pause it, delete it. The deployer,
        # because its role is to deploy and then be idle — it is not the agent, whose key lives
        # inside the enclave and never signs a deploy, and not the upgrader, whose blast radius
        # is account code rather than a workflow.
        workflow-owner-address: "0x6DCd7485aB17e0CBD0723b8435a35bb8d029439E"
    rpcs:
        # The workflow registry lives on Ethereum mainnet, not on the chain the workflow reads.
        # Deploying and linking a key are mainnet transactions, at mainnet gas.
        - chain-name: ethereum-mainnet
          url: https://ethereum-rpc.publicnode.com
        - chain-name: ethereum-mainnet-arbitrum-1
          url: https://arb1.arbitrum.io/rpc
