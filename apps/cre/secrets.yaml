# ==========================================================================
# CRE SECRETS
# ==========================================================================
# Maps a secret id the workflow asks for to the environment variable holding
# its value. In a Confidential Workflow the Vault DON releases these directly
# into the attested enclave; node operators never see them.
#
# WHAT IS SECRET HERE, AND WHY IT MATTERS.
# The account, the lending market and the asset are public: they are on chain
# and anyone can read them. What is not public is the policy — how much of the
# capital should be earning, how much has to stay liquid to cover a swap, and
# how large a difference is worth paying gas to correct. That is the strategy,
# it is what a competitor would want, and it is read only inside the enclave.
#
# Unlike the vault's mandate, nothing on chain holds these. `HelicoAccount`
# enforces the *shape* of what an agent may do — capital moves between the
# account and a market the owner allowlisted, with no recipient anywhere in
# the call — and leaves *how much* and *when* to the enclave. So a wrong value
# here produces a wrong-sized move, not a stolen one, and the check against it
# is `policyHash` in the config: publish the hash and the enclave refuses any
# secrets that do not produce it. Leave that hash zero and there is nothing to
# disagree with.
#
# AGENT_KEY is the signing key for `delivery: signature`, where the enclave
# signs an EIP-712 statement about the move it decided on. It is the one key
# in the system that must never leave an enclave.
#
# SPLIT ACROSS TWO FILES, AND NOT BY THEME.
# `cre secrets create` refuses a payload of more than ten: "cannot have more
# than 10 items in a single payload". There are eleven. The policy and the
# agent key are the eight that decide what the enclave does with money, so
# they stay together here and the model router's three credentials move to
# `secrets-ai.yaml`. Upload both — the DON holds one namespace either way, and
# the workflow asks for names, not for files.
secretsNames:
    IDLE_TARGET_WORKING_BPS:
        - SECRET_IDLE_TARGET_WORKING_BPS
    IDLE_MIN_IDLE_AMOUNT:
        - SECRET_IDLE_MIN_IDLE_AMOUNT
    IDLE_MIN_MOVE_AMOUNT:
        - SECRET_IDLE_MIN_MOVE_AMOUNT
    IDLE_MIN_MOVE_BPS:
        - SECRET_IDLE_MIN_MOVE_BPS
    IDLE_MIN_SUPPLY_RATE_RAY:
        - SECRET_IDLE_MIN_SUPPLY_RATE_RAY
    IDLE_MAX_MOVE_AMOUNT:
        - SECRET_IDLE_MAX_MOVE_AMOUNT
    IDLE_EXPIRY:
        - SECRET_IDLE_EXPIRY
    AGENT_KEY:
        - SECRET_AGENT_KEY
