# ==========================================================================
# CRE SECRETS
# ==========================================================================
# Maps a secret id the workflow asks for to the environment variable holding
# its value. In a Confidential Workflow the Vault DON releases these directly
# into the attested enclave; node operators never see them.
#
# WHAT IS SECRET HERE, AND WHY IT MATTERS.
# The mandate is seven fields. One of them, the pool, is public: it has to be,
# because the vault stores it and anyone can read the chain. The other six are
# the user's strategy — how tight a band they want, how often they will pay to
# move, how much of the position a move may burn through. Those are what a
# competitor would want and what a front-runner could use, so they live here
# and are read only inside the enclave.
#
# The vault never trusts them on the strength of this file. Every report
# carries `keccak256(abi.encode(mandate))`, and the vault refuses a verdict
# whose hash is not the one its own storage holds. So a secret that disagrees
# with the committed mandate cannot move a position; it can only fail.
#
# AGENT_KEY is the signing key for `delivery: signature`, where the enclave
# signs an EIP-712 authorisation instead of writing through a forwarder. It is
# the one key in the system that must never leave an enclave.
secretsNames:
    MANDATE_RANGE_WIDTH_TICKS:
        - SECRET_MANDATE_RANGE_WIDTH_TICKS
    MANDATE_MIN_IMPROVEMENT_BPS:
        - SECRET_MANDATE_MIN_IMPROVEMENT_BPS
    MANDATE_COOLDOWN_SECONDS:
        - SECRET_MANDATE_COOLDOWN_SECONDS
    MANDATE_MAX_LIQUIDITY:
        - SECRET_MANDATE_MAX_LIQUIDITY
    MANDATE_EXPIRY:
        - SECRET_MANDATE_EXPIRY
    MANDATE_MIN_RETAINED_BPS:
        - SECRET_MANDATE_MIN_RETAINED_BPS
    AGENT_KEY:
        - SECRET_AGENT_KEY
