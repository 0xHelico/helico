# ==========================================================================
# CRE SECRETS — one item, because the DON serves one retrieval per execution
# ==========================================================================
# This was eleven entries, uploaded from two subset files because `cre secrets
# create` refuses more than ten items in one payload. Every deployed run then
# failed at retrieval, and three measurements narrowed why:
#
#   eleven ids in one batch  ->  `batch secret retrieval failed for 11 request(s)`
#   ten in one batch         ->  the same failure, only the count changed
#   one call per secret      ->  call 0 succeeded, call 1 failed — twice, same binary
#
# The third shape is the one Chainlink's Confidential Workflows reference names
# for TypeScript, and it is the one that proved the limit is on requests rather
# than on items: the first request was answered. So the eleven values travel as
# one JSON document, built by `scripts/pack-cre-vault.py` and unpacked inside
# the enclave. One request, one item, is the only shape the measurements leave.
#
# The subset files are gone with the limit that caused them: one item is under
# ten, so this manifest is uploaded directly.
#
# WHAT IS SECRET HERE, AND WHY IT MATTERS.
# The account, the lending market and the asset are public: they are on chain
# and anyone can read them. What is not public is the policy — how much of the
# capital should be earning, how much has to stay liquid to cover a swap, and
# how large a difference is worth paying gas to correct. That is the strategy,
# and it is read only inside the enclave.
#
# AGENT_KEY is the signing key for `delivery: signature`, where the enclave
# signs an EIP-712 statement about the move it decided on. It is the one key in
# the system that must never leave an enclave, and it now shares a document
# with the policy — worse hygiene than separating them, and no worse exposure,
# since the Vault DON releases the document only into the enclave. It is here
# because a measured limit forced it, not because it is better.
secretsNames:
    HELICO_VAULT:
        - SECRET_HELICO_VAULT
