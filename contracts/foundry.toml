[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["lib"]
solc = "0.8.28"
optimizer = true
optimizer_runs = 200
via_ir = false
# Emit the storage layout into every artifact, so `forge inspect` can always answer and
# `scripts/check-storage-layout.py` never reports a stale cache as a mystery.
extra_output = ["storageLayout"]

[fmt]
line_length = 110
tab_width = 4
bracket_spacing = false

# Fork tests read this. An env lookup rather than a literal so anyone running them can point
# at their own node; `forge test` skips the fork suite when it is unset.
[rpc_endpoints]
arbitrum = "${ARBITRUM_RPC_URL}"
