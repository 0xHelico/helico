name: landing

# Builds the landing image on every merge to main, publishes it to GHCR, and asks the VPS to
# redeploy. The deploy step only runs when the VPS variables exist, so a fork or a clone still
# gets the build without the deploy. The ask goes over SSH with a key that can run exactly one
# command on the server (a forced command that names the app); the Coolify token never leaves
# the box (#108).
on:
  push:
    branches: [main]
    paths:
      - apps/landing/**
      # The blog is built at build time from these files — through the backend's API when it
      # answers, and straight from the Markdown otherwise. Either way the built site is a
      # snapshot, so a post that lands without a rebuild is published to the API and invisible
      # on helico.site. That is exactly what happened to the 8 September post: the API served
      # five, the page showed four, and the new one was a 404.
      - apps/be/content/**
      # For the same reason: Build.astro reads a function out of the contract source at build
      # time, so the page can go stale against the code it is quoting.
      - contracts/src/**
      - contracts/test/**
      - package.json
      - bun.lock
      - .dockerignore
      - .github/workflows/landing-deploy.yml
  workflow_dispatch:

concurrency:
  # One queue for all three, not one each. Three separate groups meant a merge touching the
  # app, the API and the landing started three Docker builds on the same VPS at once, and
  # concurrent builds are what stops that VM: on 9 September its journal ended mid-build with no
  # OOM, no panic and no shutdown sequence, which is the hypervisor killing it (#103).
  #
  # `cancel-in-progress: false` because these are different applications sharing a queue. The
  # landing must wait for the app rather than cancel it, and cancelling a deploy that is already
  # replacing a container is how a half-deployed service happens.
  group: vps-deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/landing/Dockerfile
          push: true
          tags: |
            ghcr.io/0xhelico/helico-landing:latest
            ghcr.io/0xhelico/helico-landing:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: image
    runs-on: ubuntu-latest
    if: ${{ vars.VPS_HOST != '' }}
    steps:
      - name: Ask the VPS to redeploy the landing
        env:
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_USER: ${{ vars.VPS_USER }}
          VPS_KNOWN_HOSTS: ${{ vars.VPS_KNOWN_HOSTS }}
          VPS_DEPLOY_KEY: ${{ secrets.VPS_DEPLOY_KEY }}
        run: |
          umask 077
          trap 'rm -f deploy_key known_hosts' EXIT
          printf '%s\n' "$VPS_DEPLOY_KEY" > deploy_key
          printf '%s\n' "$VPS_KNOWN_HOSTS" > known_hosts
          # `ServerAliveInterval` because this connection has dropped mid-deploy: on 9 September
          # it died after four and a half minutes with `client_loop: send disconnect: Broken
          # pipe`, and the workflow called a deploy that had succeeded a failure.
          #
          # The exit code is deliberately not the verdict any more. It answers "did the
          # connection survive long enough to hear back", which is a different question from
          # "is the new build serving" — and the two come apart in both directions. `|| true`
          # hands the decision to the step below, which asks the site.
          ETAG_BEFORE=$(curl -sI https://helico.site/ | tr -d '\r' | awk 'tolower($1)=="etag:"{print $2}')
          echo "etag before: ${ETAG_BEFORE:-none}"
          ssh -i deploy_key -o UserKnownHostsFile=known_hosts -o StrictHostKeyChecking=yes \
            -o BatchMode=yes -o ServerAliveInterval=15 -o ServerAliveCountMax=40 \
            "$VPS_USER@$VPS_HOST" landing || echo "ssh returned $? — the site decides, not this"
          echo "ETAG_BEFORE=$ETAG_BEFORE" >> "$GITHUB_ENV"

      # This is the check. An old build keeps its old ETag, so it cannot pass if the deploy did
      # not happen — which is the property the SSH exit code was standing in for and never had.
      - name: The site is serving a new build
        env:
          ETAG_BEFORE: ${{ env.ETAG_BEFORE }}
        run: |
          for i in $(seq 1 60); do
            now=$(curl -sI https://helico.site/ | tr -d '\r' | awk 'tolower($1)=="etag:"{print $2}')
            if [ -n "$now" ] && [ "$now" != "$ETAG_BEFORE" ]; then
              echo "serving a new build after ${i}0s: $ETAG_BEFORE -> $now"
              exit 0
            fi
            sleep 10
          done
          echo "helico.site still serves $ETAG_BEFORE after ten minutes"
          exit 1
