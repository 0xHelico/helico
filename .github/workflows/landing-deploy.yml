name: landing

# Builds the landing image on every merge to main, publishes it to GHCR, and asks Coolify to
# redeploy. The deploy step only runs when the two Coolify secrets exist, so a fork or a
# clone still gets the build without the deploy.
on:
  push:
    branches: [main]
    paths:
      - apps/landing/**
      - contracts/src/**
      - contracts/test/**
      - package.json
      - bun.lock
      - .dockerignore
      - .github/workflows/landing-deploy.yml
  workflow_dispatch:

concurrency:
  group: landing-deploy
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/landing/Dockerfile
          push: true
          tags: |
            ghcr.io/0xhelico/helico-landing:latest
            ghcr.io/0xhelico/helico-landing:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: image
    runs-on: ubuntu-latest
    if: ${{ vars.COOLIFY_URL != '' }}
    steps:
      - name: Ask Coolify to redeploy the landing
        env:
          COOLIFY_URL: ${{ vars.COOLIFY_URL }}
          COOLIFY_APP_UUID: ${{ secrets.COOLIFY_APP_UUID }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          test -n "$COOLIFY_APP_UUID" && test -n "$COOLIFY_TOKEN"
          # Coolify 4.3 answers GET here with "This endpoint has changed to a POST request."
          curl --fail --silent --show-error -X POST \
            -H "Authorization: Bearer $COOLIFY_TOKEN" \
            "$COOLIFY_URL/api/v1/deploy?uuid=$COOLIFY_APP_UUID&force=false"
