name: be

# Every merge to main that touches the backend: build the image here, publish it to GHCR, and
# ask the VPS to redeploy — the same shape as app-deploy.yml and landing-deploy.yml.
#
# The build moved off the VPS because building on it was killing it. Twice in one afternoon the
# hypervisor stopped the VM mid-build, with no shutdown sequence, no OOM and no panic, and it
# stayed down 41 minutes until someone pressed the button (#103). It is a loop rather than two
# incidents: a reboot makes Coolify rebuild, and the rebuild kills the box again. The machine had
# been up from 30 August to 7 September; what changed was that heavy builds started running on it.
#
# The image job alone does not finish the move. Coolify has to be pointed at a Docker Image
# source, or it will keep rebuilding from git on the box and this only adds a second build
# somewhere else. See docs/deployment.md.
on:
  push:
    branches: [main]
    paths:
      - apps/be/**
      - .dockerignore
      - .github/workflows/be-deploy.yml
  workflow_dispatch:

concurrency:
  group: be-deploy
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/be/Dockerfile
          push: true
          tags: |
            ghcr.io/0xhelico/helico-be:latest
            ghcr.io/0xhelico/helico-be:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: image
    runs-on: ubuntu-latest
    if: ${{ vars.VPS_HOST != '' }}
    steps:
      - name: Ask the VPS to redeploy the API
        env:
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_USER: ${{ vars.VPS_USER }}
          VPS_KNOWN_HOSTS: ${{ vars.VPS_KNOWN_HOSTS }}
          VPS_DEPLOY_KEY: ${{ secrets.VPS_DEPLOY_KEY }}
        run: |
          umask 077
          trap 'rm -f deploy_key known_hosts' EXIT
          printf '%s\n' "$VPS_DEPLOY_KEY" > deploy_key
          printf '%s\n' "$VPS_KNOWN_HOSTS" > known_hosts
          # `ServerAliveInterval` because this connection has dropped mid-deploy — see
          # landing-deploy.yml, where it turned a successful deploy into a red workflow.
          #
          # The exit code stays the verdict here, unlike the landing. The landing serves a static
          # build whose ETag changes, so it can be *asked* whether the new build is live; the
          # API reports no version, so the only available check is that it answers at all —
          # and the old container answers too. Calling that a deploy check would be the mistake
          # this comment exists to avoid. #281 tracks giving it something to report.
          ssh -i deploy_key -o UserKnownHostsFile=known_hosts -o StrictHostKeyChecking=yes \
            -o BatchMode=yes -o ServerAliveInterval=15 -o ServerAliveCountMax=40 \
            "$VPS_USER@$VPS_HOST" api

      # Not proof the deploy landed — the previous container answers this too. It catches the
      # case where the deploy took the service down and nothing came back.
      - name: The API answers
        run: |
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -m 10 https://api.helico.site/healthz || echo 000)
            [ "$code" = "200" ] && { echo "API answers 200"; exit 0; }
            sleep 10
          done
          echo "API did not answer 200 within five minutes"
          exit 1
