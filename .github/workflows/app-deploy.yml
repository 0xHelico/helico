name: app

# Builds the dapp image on every merge to main, publishes it to GHCR, and asks the VPS to
# redeploy. The deploy step only runs when the VPS variables exist, so a fork or a clone still
# gets the build without the deploy. The ask goes over SSH with a key that can run exactly one
# command on the server (a forced command that names the app); the Coolify token never leaves
# the box (#108).
on:
  push:
    branches: [main]
    paths:
      - apps/app/**
      - packages/plugins/**
      - package.json
      - bun.lock
      - .dockerignore
      - .github/workflows/app-deploy.yml
  workflow_dispatch:

concurrency:
  group: app-deploy
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/app/Dockerfile
          push: true
          tags: |
            ghcr.io/0xhelico/helico-app:latest
            ghcr.io/0xhelico/helico-app:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: image
    runs-on: ubuntu-latest
    if: ${{ vars.VPS_HOST != '' }}
    steps:
      - name: Ask the VPS to redeploy the app
        env:
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_USER: ${{ vars.VPS_USER }}
          VPS_KNOWN_HOSTS: ${{ vars.VPS_KNOWN_HOSTS }}
          VPS_DEPLOY_KEY: ${{ secrets.VPS_DEPLOY_KEY }}
        run: |
          umask 077
          trap 'rm -f deploy_key known_hosts' EXIT
          printf '%s\n' "$VPS_DEPLOY_KEY" > deploy_key
          printf '%s\n' "$VPS_KNOWN_HOSTS" > known_hosts
          # `ServerAliveInterval` because this connection has dropped mid-deploy — see
          # landing-deploy.yml, where it turned a successful deploy into a red workflow.
          #
          # The exit code stays the verdict here, unlike the landing. The landing serves a static
          # build whose ETag changes, so it can be *asked* whether the new build is live; the
          # app reports no version, so the only available check is that it answers at all —
          # and the old container answers too. Calling that a deploy check would be the mistake
          # this comment exists to avoid. #281 tracks giving it something to report.
          ssh -i deploy_key -o UserKnownHostsFile=known_hosts -o StrictHostKeyChecking=yes \
            -o BatchMode=yes -o ServerAliveInterval=15 -o ServerAliveCountMax=40 \
            "$VPS_USER@$VPS_HOST" app

      # Not proof the deploy landed — the previous container answers this too. It catches the
      # case where the deploy took the service down and nothing came back.
      - name: The app answers
        run: |
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -m 10 https://app.helico.site/ || echo 000)
            [ "$code" = "200" ] && { echo "app answers 200"; exit 0; }
            sleep 10
          done
          echo "app did not answer 200 within five minutes"
          exit 1
