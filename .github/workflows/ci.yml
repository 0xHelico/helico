name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The README's code links are pinned to commits, and `check-readme-links.py` compares
          # each pin against the working tree. A shallow clone does not have those commits, and
          # the script says so rather than passing: `cannot compare against … — fetch it`.
          fetch-depth: 0
      # The backend's vet and tests run through the same Turborepo tasks as everything else.
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/be/go.mod
          cache-dependency-path: apps/be/go.sum
      - name: Check Go formatting
        working-directory: apps/be
        run: test -z "$(gofmt -l .)"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run check
      # apps/app keeps its own Biome, because a Next app formats differently from the rest of
      # the repository. `bun run check` skips it by design, so nothing linted it until this.
      - run: bunx turbo run lint
      - run: bun run typecheck
      # A judge has to be able to find the code behind each claim. The script existed and nothing
      # ran it, so five of the twenty-three pins had drifted by the time anyone looked — and a
      # permalink to the wrong lines is worse than none, because it looks checked.
      - run: python3 scripts/check-readme-links.py
      # nginx drops every inherited `add_header` in a location that sets one of its own, so the
      # landing was serving two headers of five on its assets while the file declared all five.
      # Nothing about a response says which headers it should have had, so this is the only place
      # the rule can be enforced before a deploy rather than after a measurement.
      - run: python3 scripts/check-nginx-headers.py
      # The permalink checker validates snapshots, which stay true by construction. This is its
      # blind spot: an ordinary relative link rots the moment a file moves, and #247 deleted 21
      # files in one change. One link was already wrong when this was written.
      - run: python3 scripts/check-doc-links.py
      # Runs every package's `test` script through Turborepo. A package without one is skipped,
      # so this step proves only what the packages define.
      - run: bun run test

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      # `contracts/lib` is not committed, so CI installs the same pinned versions the
      # remappings expect. Pinned rather than floating: a security suite that silently
      # changes what it compiles against proves less each time it runs.
      - name: Install Solidity dependencies
        working-directory: contracts
        run: |
          forge install --no-git --shallow \
            foundry-rs/forge-std@v1.16.2 \
            OpenZeppelin/openzeppelin-contracts@v5.7.0 \
            OpenZeppelin/openzeppelin-contracts-upgradeable@v5.7.0 \
            1inch/aqua@v1.0.0 \
            1inch/solidity-utils@6.9.7 \
            1inch/swap-vm@v1.0.2
      - name: Check formatting
        working-directory: contracts
        run: forge fmt --check
      # The default profile does not compile `src/swapvm` — SwapVM needs the IR pipeline, and
      # turning that on for everything changes when custom-error arguments are evaluated. This
      # step is what stops "skipped by the default profile" from becoming "never compiled".
      - name: Build the SwapVM instruction set
        working-directory: contracts
        run: FOUNDRY_PROFILE=swapvm forge build
      # Before the build, because the compiler's own message names a version requirement rather
      # than the file that is out of step. Two green branches can still merge into a main that
      # does not compile -- one moves the pin, the other adds a file carrying the old one, and
      # neither CI run can see the other. This catches it on the second merge rather than on
      # whoever pulls main next.
      - name: Every pragma matches the pinned compiler
        run: python3 scripts/check-pragmas.py
      - name: Build
        working-directory: contracts
        run: forge build
      - name: Multicall stays safe
        run: python3 scripts/check-no-payable.py
      - name: Storage layout is upgrade-safe
        run: python3 scripts/check-storage-layout.py
      # The manifest and the upload files are edited separately and must add up. Drift either way
      # is invisible until a deployed run fails at secret retrieval, with a message that reads
      # like a DON outage. Raised by @rifkyeasy reviewing #232.
      - name: Check the CRE secrets manifest against its uploads
        run: python3 scripts/check-cre-secrets.py
      - name: Test
        working-directory: contracts
        # ARBITRUM_RPC_URL is deliberately unset here, so the fork suite reports SKIP rather
        # than PASS. Those tests need a chain, and a green tick for tests that never ran is
        # worth less than an honest gap.
        run: forge test -vv
