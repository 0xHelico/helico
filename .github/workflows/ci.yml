name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The backend's vet and tests run through the same Turborepo tasks as everything else.
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/be/go.mod
          cache-dependency-path: apps/be/go.sum
      - name: Check Go formatting
        working-directory: apps/be
        run: test -z "$(gofmt -l .)"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run check
      # apps/app keeps its own Biome, because a Next app formats differently from the rest of
      # the repository. `bun run check` skips it by design, so nothing linted it until this.
      - run: bunx turbo run lint
      - run: bun run typecheck
      # Runs every package's `test` script through Turborepo. A package without one is skipped,
      # so this step proves only what the packages define.
      - run: bun run test

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      # `contracts/lib` is not committed, so CI installs the same pinned versions the
      # remappings expect. Pinned rather than floating: a security suite that silently
      # changes what it compiles against proves less each time it runs.
      - name: Install Solidity dependencies
        working-directory: contracts
        run: |
          forge install --no-git --shallow \
            foundry-rs/forge-std@v1.16.2 \
            OpenZeppelin/openzeppelin-contracts@v5.7.0 \
            OpenZeppelin/openzeppelin-contracts-upgradeable@v5.7.0
      - name: Check formatting
        working-directory: contracts
        run: forge fmt --check
      - name: Build
        working-directory: contracts
        run: forge build
      - name: Multicall stays safe
        run: python3 scripts/check-no-payable.py
      - name: Storage layout is upgrade-safe
        run: python3 scripts/check-storage-layout.py
      - name: Test
        working-directory: contracts
        # ARBITRUM_RPC_URL is deliberately unset here, so the fork suite reports SKIP rather
        # than PASS. Those tests need a chain, and a green tick for tests that never ran is
        # worth less than an honest gap.
        run: forge test -vv
